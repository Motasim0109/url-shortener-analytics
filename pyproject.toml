[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-shortener-analytics"
version = "0.1.0"
description = "A URL shortener built incrementally with FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2,<3",
    "alembic>=1.14,<2",
    "pwdlib[argon2]>=0.3,<1",
    "email-validator>=2.3,<3",
    "PyJWT>=2.13,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

