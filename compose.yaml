services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg://url_shortener_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/url_shortener_analytics"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: url_shortener_analytics
      POSTGRES_USER: url_shortener_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "url_shortener_app", "-d", "url_shortener_analytics"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
